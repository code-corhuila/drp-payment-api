# API process only (Anexo J). No Postgres container. Engine: drp-infra-postgres.
# Walking events stay POST /internal/events (Q-001). No AMQP in this file.

name: ${COMPOSE_PROJECT_NAME:-drp-dev}

services:
  payment-api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: drp-payment-api
    environment:
      PORT: ${PORT:-8084}
      HTTP_ADDR: ${HTTP_ADDR:-:8084}
      SERVICE_NAME: ${SERVICE_NAME:-payment-service}
      IDENTITY_JWKS_URL: ${IDENTITY_JWKS_URL:-http://identity-api:8081/api/v1/auth/jwks}
      RESERVATION_API_URL: ${RESERVATION_API_URL:-http://reservation-api:8083}
      NOTIFICATION_API_URL: ${NOTIFICATION_API_URL:-http://notification-api:8085}
      PAYMENT_INTERNAL_TOKEN: ${PAYMENT_INTERNAL_TOKEN:-change-me-tb6-payment}
      NOTIFICATION_INTERNAL_TOKEN: ${NOTIFICATION_INTERNAL_TOKEN:-change-me-notification-hop}
      INTERNAL_EVENT_TOKEN: ${INTERNAL_EVENT_TOKEN:-}
      DATABASE_URL: ${DATABASE_URL:-postgres://payment_app:change-me-payment@postgres:5432/drp?sslmode=disable&search_path=payment}
    ports:
      - "${HTTP_PORT:-8084}:8084"
    networks:
      - pg

networks:
  pg:
    name: ${PAYMENT_API_NETWORK:-drp-dev_default}
    external: true
